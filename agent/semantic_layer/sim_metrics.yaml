# Semantic layer for the semi-synthetic dataset (sim/dgp.py).
# Same YAML block format as the internship metric library, plus `period`,
# which Gate G1 uses to reject covariates measured at or after treatment.
metrics:
  - id: "T1"
    name: "平均妥投天数"
    aliases: ["妥投时效", "delivery days"]
    definition: "用户在干预期内所有包裹妥投天数的平均值"
    column: "D"
    role: "treatment"
    period: "treatment"
    unit: "天"
  - id: "Y1"
    name: "日均 GMV 变化"
    aliases: ["GMV 变化", "ΔGMV"]
    definition: "post 期日均 GMV 减 pre 期日均 GMV"
    column: "dY"
    role: "outcome"
    period: "post"
    unit: "美元/天"
  - id: "Y0"
    name: "placebo 日均 GMV 变化"
    definition: "pre2 期日均 GMV 减 pre1 期日均 GMV，用于平行趋势检验"
    column: "dY_placebo"
    role: "placebo_outcome"
    period: "pre"
    unit: "美元/天"
  - id: "X1"
    name: "历史平均妥投天数（对数）"
    column: "log_hist_days"
    role: "covariate"
    period: "pre"
  - id: "X2"
    name: "收货地区"
    column: "region"
    role: "covariate"
    period: "pre"
  - id: "X3"
    name: "pre 期 GMV（对数）"
    column: "log_pre_gmv"
    role: "covariate"
    period: "pre"
  - id: "X4"
    name: "pre 期订单数"
    column: "orders"
    role: "covariate"
    period: "pre"
  - id: "X5"
    name: "品类结构"
    column: "cat_share"
    role: "covariate"
    period: "pre"
  - id: "X6"
    name: "注册时长"
    column: "tenure"
    role: "covariate"
    period: "pre"
  - id: "X7"
    name: "post 期订单数"
    definition: "干预后变量，不能作为混淆变量（埋入的陷阱）"
    column: "post_orders"
    role: "covariate"
    period: "post"
  - id: "G1"
    name: "用户价值档"
    column: "tier"
    role: "group"
    period: "pre"
